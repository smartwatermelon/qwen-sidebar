<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Qwen Sidebar</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 0; margin: 0; background: #1e1e1e; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    header h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .status { font-size: 11px; padding: 4px 8px; border-radius: 4px; }
    .connected { background: #1b4d2e; color: #4ade80; }
    .disconnected { background: #4d1b1b; color: #f87171; }
    
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 13px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
    .user { background: #2563eb; color: white; align-self: flex-end; }
    .assistant { background: #2d2d2d; color: #e0e0e0; align-self: flex-start; border: 1px solid #404040; }
    .error { background: #4d1b1b; color: #f87171; align-self: center; font-size: 12px; text-align: center; }

    #context-area { padding: 8px 12px; border-top: 1px solid #333; display: flex; gap: 8px; background: #1e1e1e; }
    #context-btn { background: #2d2d2d; border: 1px solid #404040; color: #e0e0e0; font-size: 12px; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    #context-btn:hover { background: #3d3d3d; border-color: #505050; }
    #context-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #input-area { padding: 12px; border-top: 1px solid #333; display: flex; gap: 8px; background: #1e1e1e; }
    textarea { flex: 1; background: #2d2d2d; border: 1px solid #404040; color: #e0e0e0; border-radius: 6px; padding: 8px; font-family: inherit; font-size: 13px; resize: none; height: 40px; }
    textarea:focus { outline: none; border-color: #3b82f6; }
    button { background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 0 16px; cursor: pointer; font-size: 13px; font-weight: 500; }
    button:hover { background: #2563eb; }
    button:disabled { background: #404040; color: #888; cursor: not-allowed; }

    #settings { padding: 12px 16px; border-bottom: 1px solid #333; background: #252525; display: none; flex-direction: column; gap: 8px; }
    #settings.open { display: flex; }
    #settings label { font-size: 11px; color: #999; display: flex; flex-direction: column; gap: 4px; }
    #settings input, #settings select { background: #2d2d2d; border: 1px solid #404040; color: #e0e0e0; border-radius: 4px; padding: 6px; font-family: inherit; font-size: 12px; }
    #settings input:focus, #settings select:focus { outline: none; border-color: #3b82f6; }
    #settings-row { display: flex; gap: 8px; align-items: center; }
    #save-settings-btn { padding: 6px 14px; font-size: 12px; }
    .hint { font-size: 10px; color: #777; line-height: 1.4; }
    .settings-error { font-size: 11px; color: #f87171; line-height: 1.4; }

    .action-card { align-self: flex-start; max-width: 85%; background: #2d2d2d; border: 1px solid #404040; border-radius: 8px; padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
    .action-card .action-label { color: #999; }
    .action-card .action-buttons { display: flex; gap: 6px; }
    .action-card button { padding: 4px 10px; font-size: 12px; }
    .action-card .action-cancel { background: transparent; border: 1px solid #404040; color: #888; }
    .action-card .action-status { color: #4ade80; }
    .action-card .action-error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h3>Qwen Sidebar</h3>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span id="status" class="status disconnected">Checking...</span>
      <button id="settings-btn" style="background: transparent; border: 1px solid #404040; color: #888; font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;">Settings</button>
    </div>
  </header>

  <div id="settings">
    <label>
      API key
      <input id="api-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-sp-...">
    </label>
    <label>
      Model
      <select id="model-input"></select>
    </label>
    <label>
      Base URL
      <input id="base-url-input" type="text" autocomplete="off" spellcheck="false">
    </label>
    <p class="hint">
      A Token Plan key (<code>sk-sp-</code>) must be paired with the Token Plan
      base URL. Mixing billing modes bills against pay-as-you-go.
    </p>
    <div id="settings-row">
      <button id="save-settings-btn">Save</button>
      <button id="clear-key-btn" style="background: transparent; border: 1px solid #404040; color: #888;">Clear key</button>
      <span id="settings-feedback" class="hint"></span>
    </div>
  </div>

  <div id="chat-container"></div>
  
  <div id="context-area">
    <button id="context-btn">
      <span>📄</span> Add Page Context
    </button>
  </div>
  <div id="input-area">
    <textarea id="user-input" placeholder="Type a message... (Shift+Enter for new line)"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
